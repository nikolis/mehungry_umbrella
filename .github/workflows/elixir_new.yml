  build_and_deploy:
    #needs: [test]
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image
      - name: Build and push Docker image
        id: build-image
        env:
          MIX_ENV: prod
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mehungry_ecr
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          docker build \
            --build-arg="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --build-arg="AWS_ASSETS_BUCKET_NAME=${{ secrets.AWS_ASSETS_BUCKET_NAME }}" \
            --build-arg="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --build-arg="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --build-arg="FACEBOOK_CLIENT_ID=${{ secrets.FACEBOOK_CLIENT_ID }}" \
            --build-arg="FACEBOOK_CLIENT_SECRET=${{ secrets.FACEBOOK_CLIENT_SECRET }}" \
            --build-arg="GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --build-arg="GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --build-arg="SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}" \
            --build-arg="MIX_ENV=prod" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Render ECS task definition with new image
      - name: Fill in new image ID in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: mehungry_app
          image: ${{ steps.build-image.outputs.image }}

      # Register task definition using AWS CLI directly
      - name: Register ECS task definition
        id: register-task
        run: |
          REGISTER_OUTPUT=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.task-def.outputs.task-definition }})
    
          TASK_DEF_ARN=$(echo $REGISTER_OUTPUT | jq -r '.taskDefinition.taskDefinitionArn')
          echo "task-definition-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
    
          echo "Registered task definition: $TASK_DEF_ARN"

      # Run DB migrations
      - name: Run DB migrations
        env:
          ECS_CLUSTER: mehungry_cluster
          TASK_DEFINITION_ARN: ${{ steps.register-task.outputs.task-definition-arn }}
          SUBNETS: subnet-09cf1e07290dd8745,subnet-0e737a54a16cefc1f,subnet-00a18ffb7a73744bf
          SECURITY_GROUP: sg-0a9dca773642f81cf
        run: |
          set -e

          echo "Starting migration task..."
          echo "Task definition ARN: $TASK_DEFINITION_ARN"

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --launch-type FARGATE \
            --task-definition $TASK_DEFINITION_ARN \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "mehungry_app",
                  "command": ["bin/mehungry_umbrella", "eval", "Mehungry.Release.migrate"]
                }
              ]
            }' \
            --query "tasks[0].taskArn" \
            --output text)
      
          echo "Started migration task: $TASK_ARN"
      
          aws ecs wait tasks-stopped \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN
      
          echo "Migration task stopped."
      
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query "tasks[0].containers[?name=='mehungry_app'].exitCode" \
            --output text)
      
          STOP_REASON=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query "tasks[0].stoppedReason" \
            --output text)
      
          echo "Migration exit code: $EXIT_CODE"
          echo "Stopped reason: $STOP_REASON"
      
          if [ -z "$EXIT_CODE" ]; then
            echo "Could not determine migration exit code"
            exit 1
          fi
      
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed!"
            exit 1
          fi
      
          echo "Migration completed successfully."
      
      # Deploy to ECS service (this registers AND deploys)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: mh-prod-service
          cluster: mehungry_cluster
          wait-for-service-stability: true
